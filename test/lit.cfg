import os
import lit.util
import lit.formats

# From libcxx lit: Tell pylint that we know config and lit_config exist somewhere.
if "PYLINT_IMPORT" in os.environ:
    config = object()
    lit_config = object()

config.name = "metavirtTest"

loaded_site_cfg = getattr(config, "loaded_site_config", False)
if not loaded_site_cfg:
    site_cfg = lit_config.params.get("metavirt_site_config", None)
    if site_cfg and os.path.exists(site_cfg):
        lit_config.load_config(config, site_cfg)
        raise SystemExit

config.test_format = lit.formats.ShTest(execute_external=True)
config.suffixes = [".c", ".cpp", ".ll"]
config.excludes = ["Inputs", "verifier"]

metavirt_lib_dir = getattr(config, "metavirt_lib_dir", None)
metavirt_pass_dir = getattr(config, "metavirt_pass_dir", None)
metavirt_pass_name = getattr(config, "metavirt_pass", None)
metavirt_runtime_dir = getattr(config, "metavirt_runtime_dir", None)
metavirt_script_dir = getattr(config, "metavirt_script_dir", None)

metavirt_std_args = "metavirt"
metavirt_args = "-O1 -g"
metavirt_pass = "{}/{}".format(metavirt_pass_dir, metavirt_pass_name)
to_llvm_args = "-S -emit-llvm -o -"

clang_cpp = getattr(config, "clang_cpp", "clang++")
clang_cc = getattr(config, "clang", "clang")
llc = getattr(config, "llc", "llc")
filecheck = getattr(config, "filecheck", "FileCheck")
if config.opt_args:
    opt = "{} {}".format(getattr(config, "opt", "opt"), config.opt_args)
else:
    opt = "{}".format(getattr(config, "opt", "opt"))

config.substitutions.append(("%clang-cpp", clang_cpp))
config.substitutions.append(("%clang-cc", clang_cc))
config.substitutions.append(("%opt", opt))
config.substitutions.append(("%filecheck", filecheck))

config.substitutions.append(("%lib_dir", metavirt_lib_dir))
config.substitutions.append(("%pass_dir", metavirt_pass_dir))
if metavirt_runtime_dir is not None:
    config.substitutions.append(("%runtime_dir", metavirt_runtime_dir))

config.substitutions.append(("%pass_name", metavirt_pass_name))
config.substitutions.append(("%pass_plugin", metavirt_pass))

config.substitutions.append(("%arg_std", metavirt_std_args))
config.substitutions.append(("%to-llvm-flags", "{}".format(to_llvm_args)))

config.substitutions.append(
    ("%c-to-llvm", "{} {} {}".format(clang_cc, metavirt_args, to_llvm_args))
)
config.substitutions.append(
    ("%cpp-to-llvm", "{} {} {}".format(clang_cpp, metavirt_args, to_llvm_args))
)

if metavirt_script_dir is not None:
    config.substitutions.append(("%script_dir", metavirt_script_dir))

config.substitutions.append(
    (
        "%apply-metavirt",
        "{} -load-pass-plugin {} -passes={}".format(
            opt, metavirt_pass, metavirt_std_args
        ),
    )
)

